name: Terraform environment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      mode:
        required: true
        type: string
      checkout_ref:
        required: true
        type: string

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  CI_ENVIRONMENT: ${{ inputs.environment }}
  CI_MODE: ${{ inputs.mode }}
  CI_CHECKOUT_REF: ${{ inputs.checkout_ref }}

jobs:
  prepare:
    name: Check configuration
    runs-on: ubuntu-latest
    environment: ${{ inputs.mode == 'plan' && format('{0}-plan', inputs.environment) || inputs.environment }}
    outputs:
      runner_labels: ${{ steps.config.outputs.runner_labels }}
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      AWS_PLAN_ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_RUNNER_LABELS: ${{ vars.TF_RUNNER_LABELS }}
      EKS_PUBLIC_ACCESS_CIDRS: ${{ vars.EKS_PUBLIC_ACCESS_CIDRS }}
      DEMO_INGRESS_CIDRS: ${{ vars.DEMO_INGRESS_CIDRS }}
      TF_ADMIN_PRINCIPAL_ARNS: ${{ vars.TF_ADMIN_PRINCIPAL_ARNS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate event and environment variables
        id: config
        run: node scripts/ci/terraform-config.mjs prepare

  terraform:
    name: ${{ inputs.mode }} ${{ inputs.environment }}
    needs: prepare
    runs-on: ubuntu-latest
    environment: ${{ inputs.mode == 'plan' && format('{0}-plan', inputs.environment) || inputs.environment }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: terraform-${{ github.repository }}-${{ inputs.environment }}-${{ inputs.mode }}
      cancel-in-progress: ${{ inputs.mode == 'plan' }}
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      AWS_PLAN_ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_RUNNER_LABELS: ${{ vars.TF_RUNNER_LABELS }}
      EKS_PUBLIC_ACCESS_CIDRS: ${{ vars.EKS_PUBLIC_ACCESS_CIDRS }}
      DEMO_INGRESS_CIDRS: ${{ vars.DEMO_INGRESS_CIDRS }}
      TF_ADMIN_PRINCIPAL_ARNS: ${{ vars.TF_ADMIN_PRINCIPAL_ARNS }}
      STATIC_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || secrets.AWS_ACESS_KEY_ID || secrets.AWS_ACCESS_KEY || secrets.AWS_ACCESS_KEYID }}
      STATIC_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || secrets.AWS_SECRET_KEY_ID || secrets.AWS_SECRET_ACCESS_KEY_ID || secrets.AWS_SECRETKEY_ID }}
      STATIC_AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN || secrets.AWS_TOKEN || secrets.AWS_SESSION }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - name: Prevent deployment of a superseded merge
        if: inputs.mode == 'apply'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/terraform-config.mjs assert-current-merge
      - name: Select AWS authentication mode
        id: aws_auth_mode
        run: |
          if [[ -n "$STATIC_AWS_ACCESS_KEY_ID" || -n "$STATIC_AWS_SECRET_ACCESS_KEY" || -n "$STATIC_AWS_SESSION_TOKEN" ]]; then
            if [[ -z "$STATIC_AWS_ACCESS_KEY_ID" || -z "$STATIC_AWS_SECRET_ACCESS_KEY" ]]; then
              echo "::error::Configure AWS_ACCESS_KEY_ID e AWS_SECRET_ACCESS_KEY nos Secrets do Environment deste job."
              exit 1
            fi
            if [[ "$STATIC_AWS_ACCESS_KEY_ID" == ASIA* && -z "$STATIC_AWS_SESSION_TOKEN" ]]; then
              echo "::error::Credenciais AWS temporárias exigem AWS_SESSION_TOKEN nos Secrets do mesmo Environment."
              exit 1
            fi
          fi
          if [[ -n "$STATIC_AWS_ACCESS_KEY_ID" && -n "$STATIC_AWS_SECRET_ACCESS_KEY" ]]; then
            echo "static_credentials=true" >> "$GITHUB_OUTPUT"
          else
            echo "static_credentials=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate to AWS using environment credentials
        if: steps.aws_auth_mode.outputs.static_credentials == 'true'
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ env.STATIC_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.STATIC_AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.STATIC_AWS_SESSION_TOKEN }}
          aws-region: us-east-1
          allowed-account-ids: "213284176265"
          unset-current-credentials: true
          mask-aws-account-id: false
      - name: Authenticate to AWS using OIDC
        if: steps.aws_auth_mode.outputs.static_credentials == 'false'
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ inputs.mode == 'apply' && vars.AWS_ROLE_ARN || vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: "213284176265"
          role-session-name: terraform-${{ github.run_id }}
          role-duration-seconds: 7200
          unset-current-credentials: true
          mask-aws-account-id: false
      - name: Resolve static AWS principal
        if: steps.aws_auth_mode.outputs.static_credentials == 'true'
        run: |
          caller_arn=$(aws sts get-caller-identity --query Arn --output text)
          if [[ "$caller_arn" == *:assumed-role/* ]]; then
            account_id=${caller_arn#arn:aws:sts::}
            account_id=${account_id%%:*}
            role_name=${caller_arn#*:assumed-role/}
            role_name=${role_name%%/*}
            caller_arn="arn:aws:iam::$account_id:role/$role_name"
          fi
          echo "TF_STATIC_PRINCIPAL_ARN=$caller_arn" >> "$GITHUB_ENV"
      - name: Prepare isolated Terraform directories and verify runner IP
        id: config
        run: node scripts/ci/terraform-config.mjs render
      - name: Initialize and validate AWS infrastructure
        env:
          INFRA_DIR: ${{ steps.config.outputs.infra_dir }}
        run: |
          # GetObject reports permission details that S3 HeadObject omits.
          # Never print the state: it can contain sensitive values.
          state_probe="$RUNNER_TEMP/infra-state-access-probe.json"
          state_error="$RUNNER_TEMP/infra-state-access-error.txt"
          if ! aws s3api get-object --bucket "$TF_STATE_BUCKET" --key infra/terraform.tfstate \
            --expected-bucket-owner 213284176265 "$state_probe" > /dev/null 2> "$state_error"; then
            if ! grep -Fq '(NoSuchKey)' "$state_error"; then
              cat "$state_error" >&2
              echo "::error::A AWS bloqueou a leitura do estado existente. Confira s3:GetObject, a política do bucket e restrições da sessão/organização. Preserve o bucket e o estado."
              exit 1
            fi
          fi
          rm -f "$state_probe"
          terraform -chdir="$INFRA_DIR" init -input=false -lockfile=readonly -backend-config=backend.hcl
          terraform -chdir="$INFRA_DIR" validate -no-color
      - name: Plan AWS infrastructure
        env:
          INFRA_DIR: ${{ steps.config.outputs.infra_dir }}
        run: node scripts/ci/terraform-config.mjs plan infra
      - name: Apply AWS infrastructure after merge
        if: inputs.mode == 'apply'
        env:
          INFRA_DIR: ${{ steps.config.outputs.infra_dir }}
        run: terraform -chdir="$INFRA_DIR" apply -input=false -no-color -lock-timeout=10m tfplan
      - name: Check whether platform can be planned before merge
        if: inputs.mode == 'plan'
        id: platform_state
        run: node scripts/ci/terraform-config.mjs platform-ready
      - name: Initialize and validate Kubernetes platform
        if: inputs.mode == 'apply' || steps.platform_state.outputs.ready == 'true'
        env:
          PLATFORM_DIR: ${{ steps.config.outputs.platform_dir }}
        run: |
          terraform -chdir="$PLATFORM_DIR" init -input=false -lockfile=readonly -backend-config=backend.hcl
          terraform -chdir="$PLATFORM_DIR" validate -no-color
      - name: Plan Kubernetes platform
        if: inputs.mode == 'apply' || steps.platform_state.outputs.ready == 'true'
        env:
          PLATFORM_DIR: ${{ steps.config.outputs.platform_dir }}
        run: node scripts/ci/terraform-config.mjs plan platform
      - name: Apply Kubernetes platform after merge
        if: inputs.mode == 'apply'
        env:
          PLATFORM_DIR: ${{ steps.config.outputs.platform_dir }}
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
        run: |
          case "$CI_ENVIRONMENT" in
            homologacao) cluster_name="tech-challenge-hml" ;;
            producao) cluster_name="tech-challenge-prod" ;;
            *) echo "::error::Ambiente Kubernetes desconhecido: $CI_ENVIRONMENT"; exit 1 ;;
          esac

          export KUBECONFIG="$RUNNER_TEMP/eks-platform-kubeconfig"
          aws eks update-kubeconfig --region us-east-1 --name "$cluster_name" --kubeconfig "$KUBECONFIG"
          if [[ "$(kubectl config current-context)" != "arn:aws:eks:us-east-1:213284176265:cluster/$cluster_name" ]]; then
            echo "::error::Contexto Kubernetes nao corresponde ao EKS de $CI_ENVIRONMENT."
            exit 1
          fi
          kubectl get nodes -o wide

          if jq -e '.enable_datadog == true' "environments/$CI_ENVIRONMENT/platform.tfvars.json" > /dev/null; then
            secret_name=$(jq -r '.datadog_api_key_secret // "datadog-secret"' "environments/$CI_ENVIRONMENT/platform.tfvars.json")
            if [[ -n "$DATADOG_API_KEY" ]]; then
              kubectl get namespace observability -o name
              printf '%s' "$DATADOG_API_KEY" |
                kubectl create secret generic "$secret_name" --from-file=api-key=/dev/stdin -n observability --dry-run=client -o json |
                kubectl apply --server-side --field-manager=tc3-datadog-secret -f -
            fi
            if ! kubectl get secret "$secret_name" -n observability -o json | jq -e '.data["api-key"] != null' > /dev/null; then
              echo "::error::Secret $secret_name ausente no EKS $cluster_name. Configure DATADOG_API_KEY nos Environment secrets de $CI_ENVIRONMENT no GitHub."
              exit 1
            fi
          fi

          diagnose_datadog() {
            echo "Estado do Datadog no EKS $cluster_name:"
            kubectl get deployments,daemonsets,pods -n observability -o wide || true
            kubectl get events -n observability --sort-by='.lastTimestamp' | tail -n 30 || true
          }

          (
            while sleep 60; do diagnose_datadog; done
          ) &
          diagnostic_pid=$!
          trap 'kill "$diagnostic_pid" 2>/dev/null || true' EXIT

          if ! terraform -chdir="$PLATFORM_DIR" apply -input=false -no-color -lock-timeout=10m tfplan; then
            diagnose_datadog
            exit 1
          fi
